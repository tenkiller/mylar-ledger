services:
  api:
    build: .
    environment:
      # Bind all interfaces inside the container; the published port below stays loopback-only.
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - mylar-data:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Only what the entrypoint needs to fix volume ownership and drop to `node`; the server process
    # itself runs unprivileged and holds no capabilities.
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true

volumes:
  mylar-data:
